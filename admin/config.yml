backend:
  name: github
  repo: Abhiram5566/bullet-news-global
  branch: main
  base_url: https://api.netlify.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ==========================================
  # 1. BULLET NEWS (Homepage & Category Feeds)
  # ==========================================
  - name: "news"
    label: "⚡ Bullet News"
    folder: "content/news"
    create: true
    format: "json"
    extension: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Headline", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Global", "China", "Korea", "India", "Esports", "Drama"]
      - { label: "Emoji / Icon Tag", name: "icon", widget: "string", default: "🤖", hint: "e.g. 🤖, 🌸, 💻, 🌧, 🏆" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Is Breaking News?", name: "isBreaking", widget: "boolean", default: false }
      - { label: "Feature on Live Ticker?", name: "showInTicker", widget: "boolean", default: true }
      - { label: "Summary / Bullet Content", name: "summary", widget: "text", hint: "Short 2-3 sentence bullet news summary" }
      - { label: "Link / Article (Optional)", name: "link", widget: "string", required: false, hint: "Optional link to full article or external source" }

  # ==========================================
  # 2. IN-DEPTH ARTICLES
  # ==========================================
  - name: "articles"
    label: "📰 Articles"
    folder: "content/articles"
    create: true
    format: "json"
    extension: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Global", "China", "Korea", "India", "Esports", "Drama"]
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentence summary shown on the card" }
      - { label: "Author", name: "author", widget: "string", default: "Bullet News Team" }
      - { label: "Body", name: "body", widget: "markdown" }
