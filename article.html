<head>

  <style>
    .article-wrap {
      max-width: 820px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue, #38bdf8);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .back-link:hover { text-decoration: underline; }
    
    .article-card-main {
      background: var(--bg-card, #161f30);
      border: 1px solid var(--border-color, #243046);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    @media (max-width: 650px) {
      .article-card-main { padding: 20px; }
    }
    .article-wrap img.cover {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color, #243046);
    }
    .article-category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-blue, #38bdf8);
      margin-bottom: 12px;
    }
    .article-wrap h1 {
      margin: 0 0 16px;
      font-size: 30px;
      line-height: 1.25;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 13.5px;
      color: var(--text-muted, #6b7280);
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .author-name {
      color: #f3f4f6;
      font-weight: 600;
    }
    .share-group {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .share-btn {
      background: var(--bg-secondary, #111827);
      border: 1px solid var(--border-color, #243046);
      color: var(--text-secondary, #9ca3af);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .share-btn:hover {
      background: var(--accent-blue, #38bdf8);
      color: #0b0f19;
    }
    .article-body {
      font-size: 16.5px;
      line-height: 1.8;
      color: #d1d5db;
    }
    .article-body p { margin-bottom: 18px; }
    .article-body h2 {
      font-size: 22px;
      color: #ffffff;
      margin: 30px 0 14px;
      font-weight: 700;
    }
    .article-body h3 {
      font-size: 18px;
      color: #38bdf8;
      margin: 24px 0 10px;
      font-weight: 600;
    }
    .article-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 20px 0;
    }
    .article-body ul, .article-body ol {
      margin: 0 0 18px 24px;
      color: #cbd5e1;
    }
    .article-body li { margin-bottom: 8px; }
    .trust-notice {
      margin-top: 36px;
      padding: 18px;
      background: var(--bg-secondary, #111827);
      border: 1px solid var(--border-color, #243046);
      border-radius: 8px;
      font-size: 13.5px;
      color: #94a3b8;
    }
    #status { text-align: center; padding: 60px; color: #9ca3af; font-size: 15px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <a href="index.html" style="text-decoration:none; color:inherit;">📰 BULLET<span class="accent">NEWS</span></a>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="china.html">China</a>
      <a href="southkorea.html">Korea</a>
      <a href="India.html">India</a>
      <a href="esports.html">Esports</a>
      <a href="dramahub.html">Drama Hub</a>
      <a href="articles.html" class="active">Articles</a>
    </nav>
  </header>

  <!-- ARTICLE MAIN WRAPPER -->
  <div class="article-wrap">
    <a class="back-link" href="articles.html">← Back to all articles</a>

    <div class="article-card-main">
      <div id="status">Loading article…</div>
      <div id="article-content" style="display:none;"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Bullet News Global • A Rudra Works Initiative. All Rights Reserved.</p>
    <div style="margin-top: 14px;">
      <a href="index.html">Home</a> •
      <a href="about.html">About & Editorial</a> •
      <a href="articles.html">Articles</a> •
      <a href="admin/">CMS Login</a>
    </div>
  </footer>

  <script>
    // ==== REPO CONFIGURATION ====
    const GITHUB_USER = "Abhiram5566";
    const GITHUB_REPO = "bullet-news-global";
    const GITHUB_BRANCH = "main";
    const ARTICLES_PATH = "content/articles";
    // ============================

    function getSlugFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("slug");
    }

    async function loadArticle() {
      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("article-content");
      const slug = getSlugFromUrl();

      if (!slug) {
        statusEl.textContent = "No article specified.";
        return;
      }

      const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${ARTICLES_PATH}/${slug}.json`;

      try {
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error("Article not found (status " + res.status + ")");
        const article = await res.json();

        statusEl.style.display = "none";
        contentEl.style.display = "block";

        const dateStr = article.date
          ? new Date(article.date).toLocaleDateString("en-US", { month: 'long', day: 'numeric', year: 'numeric' })
          : "";

        const coverHtml = article.image
          ? `<img class="cover" src="${article.image}" alt="${article.title || ''}">`
          : "";

        const bodyHtml = window.marked ? marked.parse(article.body || "") : (article.body || "");
        const currentUrl = window.location.href;

        contentEl.innerHTML = `
          ${coverHtml}
          <div class="article-category">${article.category || "ANALYSIS"}</div>
          <h1>${article.title || "Untitled"}</h1>
          <div class="article-meta">
            <span>By <span class="author-name">${article.author || "Bullet News Team"}</span></span>
            <span>•</span>
            <span>${dateStr}</span>
            <div class="share-group">
              <a class="share-btn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article.title || '')}&url=${encodeURIComponent(currentUrl)}" target="_blank">Share on X</a>
              <a class="share-btn" href="https://api.whatsapp.com/send?text=${encodeURIComponent((article.title || '') + ' ' + currentUrl)}" target="_blank">WhatsApp</a>
            </div>
          </div>
          <div class="article-body">${bodyHtml}</div>
          <div class="trust-notice">
            <p><strong>Editorial Disclosure:</strong> Published by <strong>Bullet News Global</strong>, a <strong>Rudra Works</strong> media publication. Verified against primary editorial sources. Learn more about our <a href="about.html" style="color:#38bdf8;">Editorial Standards</a>.</p>
          </div>
        `;

        document.title = (article.title || "Article") + " — Bullet News";

        // INJECT SCHEMA.ORG NEWSARTICLE JSON-LD
        const schema = {
          "@context": "https://schema.org",
          "@type": "NewsArticle",
          "headline": article.title || "",
          "image": article.image ? [article.image] : [],
          "datePublished": article.date || new Date().toISOString(),
          "dateModified": article.date || new Date().toISOString(),
          "author": [{
            "@type": "Organization",
            "name": article.author || "Bullet News Team",
            "url": "https://bulletnewsglobal.netlify.app/about.html"
          }],
          "publisher": {
            "@type": "NewsMediaOrganization",
            "name": "Bullet News Global",
            "url": "https://bulletnewsglobal.netlify.app/",
            "parentOrganization": {
              "@type": "Organization",
              "name": "Rudra Works"
            }
          },
          "description": article.excerpt || ""
        };

        const scriptEl = document.createElement("script");
        scriptEl.type = "application/ld+json";
        scriptEl.text = JSON.stringify(schema);
        document.head.appendChild(scriptEl);

      } catch (err) {
        statusEl.textContent = "Error loading article: " + err.message;
        console.error(err);
      }
    }

    loadArticle();
  </script>
</body>
</html>
