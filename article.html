<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — Bullet News</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script><style>.article-wrap{max-width:820px;margin:30px auto;padding:0 20px}.article-card-main{background:var(--bg-card,#161f30);border:1px solid var(--border-color,#243046);border-radius:12px;padding:36px}.article-wrap h1{color:#fff}.article-body{font-size:16.5px;line-height:1.8;color:#000!important}.article-body *{color:#000!important;text-shadow:none!important}.article-body h1,.article-body h2,.article-body h3,.article-body h4,.article-body h5,.article-body h6{color:#000!important;font-weight:800}.article-body p,.article-body li,.article-body strong,.article-body em,.article-body blockquote,.article-body span{color:#000!important}.article-body a{color:#000!important;text-decoration:underline}.article-body ul,.article-body ol{color:#000!important}.article-body hr{border-color:#000}.article-cover{width:100%;height:320px;object-fit:cover;border-radius:10px;margin:0 0 24px;display:block}.article-category{color:#38bdf8;font-weight:700;text-transform:uppercase}.article-meta{color:#9ca3af;margin:15px 0 18px}.share-row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px;padding-bottom:18px;border-bottom:1px solid rgba(0,0,0,.12)}.share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:7px;background:#111827;color:#fff!important;text-decoration:none!important;font-size:13px;font-weight:700;border:0;cursor:pointer}.share-btn:hover{opacity:.85}.share-label{font-size:13px;font-weight:700;color:#000!important;display:flex;align-items:center;margin-right:2px}.trust-notice{margin-top:36px;padding:18px;background:#111827;color:#94a3b8;border:1px solid #243046;border-radius:8px}@media(max-width:650px){.article-card-main{padding:20px}.share-row{gap:7px}.share-btn{padding:7px 10px;font-size:12px}}</style></head><body><header><div class="logo"><a href="index.html" style="text-decoration:none;color:inherit">📰 BULLET<span class="accent">NEWS</span></a></div><nav><a href="index.html">Home</a><a href="china.html">China</a><a href="southkorea.html">Korea</a><a href="India.html">India</a><a href="esports.html">Esports</a><a href="dramahub.html">Drama Hub</a><a href="articles.html" class="active">Articles</a><a href="submit-news.html">Submit a Story</a></nav></header><main class="article-wrap"><a class="back-link" href="articles.html">← Back to all articles</a><div class="article-card-main"><div id="status">Loading article…</div><div id="article-content" style="display:none"></div></div></main><footer><p>© 2026 Bullet News Global • A Rudra Works Initiative. All Rights Reserved.</p></footer><script>const p=new URLSearchParams(location.search),slug=p.get("slug");const fallbackImages={china:"https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1200&q=80",korea:"https://images.unsplash.com/photo-1538485399081-7c897a3b0b9a?auto=format&fit=crop&w=1200&q=80",india:"https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=1200&q=80",technology:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80",esports:"https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80",drama:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1200&q=80",society:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80",default:"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80"};function getFallbackImage(a){const x=((a.category||"")+" "+(a.title||"")).toLowerCase();if(x.includes("china"))return fallbackImages.china;if(x.includes("korea"))return fallbackImages.korea;if(x.includes("india"))return fallbackImages.india;if(x.includes("technology")||x.includes("tech")||x.includes("ai"))return fallbackImages.technology;if(x.includes("esport")||x.includes("gaming"))return fallbackImages.esports;if(x.includes("drama")||x.includes("entertainment"))return fallbackImages.drama;if(x.includes("society")||x.includes("rights"))return fallbackImages.society;return fallbackImages.default;}async function load(){const s=document.getElementById("status"),c=document.getElementById("article-content");if(!slug){s.textContent="No article specified.";return}try{const r=await fetch(`https://raw.githubusercontent.com/Abhiram5566/bullet-news-global/main/content/articles/${encodeURIComponent(slug)}.json`);if(!r.ok)throw Error("Article not found");const a=await r.json();s.style.display="none";c.style.display="block";const url=location.href;const title=a.title||"Bullet News Article";const cover=a.image||getFallbackImage(a);c.innerHTML=`<div class="article-category">${a.category||"ARTICLE"}</div><h1>${title}</h1><div class="article-meta">By ${a.author||"Bullet News Team"} • ${a.date?new Date(a.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):""}</div><img class="article-cover" loading="lazy" src="${cover}" alt="${title}"><div class="share-row"><span class="share-label">Share:</span><a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener">Facebook</a><a class="share-btn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}" target="_blank" rel="noopener">X</a><a class="share-btn" href="https://api.whatsapp.com/send?text=${encodeURIComponent(title+" "+url)}" target="_blank" rel="noopener">WhatsApp</a><a class="share-btn" href="mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(url)}">Email</a><button class="share-btn" onclick="navigator.clipboard.writeText(location.href).then(()=>{this.textContent='Copied!'})">Copy Link</button></div><div class="article-body">${marked.parse(a.body||"")}</div><div class="trust-notice">Published by <strong>Bullet News Global</strong>, a Rudra Works media publication.</div>`;document.title=title+" — Bullet News"}catch(e){s.textContent="Error loading article: "+e.message}}load();</script></body></html>
