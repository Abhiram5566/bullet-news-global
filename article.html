<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — Bullet News</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script><style>.article-wrap{max-width:820px;margin:30px auto;padding:0 20px}.article-card-main{background:var(--bg-card,#161f30);border:1px solid var(--border-color,#243046);border-radius:12px;padding:36px}.article-wrap h1{color:#fff}.article-body{font-size:16.5px;line-height:1.8;color:#000!important}.article-body *{color:#000!important;text-shadow:none!important}.article-body h1,.article-body h2,.article-body h3,.article-body h4,.article-body h5,.article-body h6{color:#000!important;font-weight:800}.article-body p,.article-body li,.article-body strong,.article-body em,.article-body blockquote,.article-body span{color:#000!important}.article-body a{color:#000!important;text-decoration:underline}.article-body ul,.article-body ol{color:#000!important}.article-body hr{border-color:#000}.article-category{color:#38bdf8;font-weight:700;text-transform:uppercase}.article-meta{color:#9ca3af;margin:15px 0 25px}.back-link{color:#38bdf8}.trust-notice{margin-top:36px;padding:18px;background:#111827;color:#94a3b8;border:1px solid #243046;border-radius:8px}@media(max-width:650px){.article-card-main{padding:20px}}</style></head><body><header><div class="logo"><a href="index.html" style="text-decoration:none;color:inherit">📰 BULLET<span class="accent">NEWS</span></a></div><nav><a href="index.html">Home</a><a href="china.html">China</a><a href="southkorea.html">Korea</a><a href="India.html">India</a><a href="esports.html">Esports</a><a href="dramahub.html">Drama Hub</a><a href="articles.html" class="active">Articles</a><a href="submit-news.html">Submit a Story</a></nav></header><main class="article-wrap"><a class="back-link" href="articles.html">← Back to all articles</a><div class="article-card-main"><div id="status">Loading article…</div><div id="article-content" style="display:none"></div></div></main><footer><p>© 2026 Bullet News Global • A Rudra Works Initiative. All Rights Reserved.</p></footer><script>const p=new URLSearchParams(location.search),slug=p.get("slug");async function load(){const s=document.getElementById("status"),c=document.getElementById("article-content");if(!slug){s.textContent="No article specified.";return}try{const r=await fetch(`https://raw.githubusercontent.com/Abhiram5566/bullet-news-global/main/content/articles/${encodeURIComponent(slug)}.json`);if(!r.ok)throw Error("Article not found");const a=await r.json();s.style.display="none";c.style.display="block";c.innerHTML=`<div class="article-category">${a.category||"ARTICLE"}</div><h1>${a.title||"Untitled"}</h1><div class="article-meta">By ${a.author||"Bullet News Team"} • ${a.date?new Date(a.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):""}</div><div class="article-body">${marked.parse(a.body||"")}</div><div class="trust-notice">Published by <strong>Bullet News Global</strong>, a Rudra Works media publication.</div>`;document.title=(a.title||"Article")+" — Bullet News"}catch(e){s.textContent="Error loading article: "+e.message}}load();</script></body></html>
