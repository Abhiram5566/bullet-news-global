<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — Bullet News</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .article-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }
    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    .article-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    .article-card-body { padding: 14px; }
    .article-card-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 6px;
    }
    .article-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.3;
    }
    .article-card p {
      margin: 0;
      font-size: 14px;
      color: #555;
      line-height: 1.4;
    }
    .article-card .meta {
      margin-top: 10px;
      font-size: 12px;
      color: #999;
    }
    #status { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>

  <h1 style="text-align:center; margin-top:32px;">Latest Articles</h1>
  <div id="status">Loading articles…</div>
  <div class="articles-grid" id="articles-grid"></div>

  <script>
    // ==== CONFIGURE THESE TO MATCH YOUR REPO ====
    const GITHUB_USER = "Abhiram5566";
    const GITHUB_REPO = "bullet-news-global";
    const GITHUB_BRANCH = "main";
    const ARTICLES_PATH = "content/articles";
    // =============================================

    const apiListUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARTICLES_PATH}?ref=${GITHUB_BRANCH}`;

    async function loadArticles() {
      const statusEl = document.getElementById("status");
      const grid = document.getElementById("articles-grid");

      try {
        const listRes = await fetch(apiListUrl);
        if (!listRes.ok) throw new Error("Could not list articles (status " + listRes.status + ")");
        const files = await listRes.json();

        const jsonFiles = files.filter(f => f.name.endsWith(".json"));

        if (jsonFiles.length === 0) {
          statusEl.textContent = "No articles published yet.";
          return;
        }

        const articles = await Promise.all(
          jsonFiles.map(async (file) => {
            const res = await fetch(file.download_url);
            const data = await res.json();
            data.__slug = file.name.replace(/\.json$/, "");
            return data;
          })
        );

        // Newest first
        articles.sort((a, b) => new Date(b.date) - new Date(a.date));

        statusEl.style.display = "none";

        articles.forEach((article) => {
          const card = document.createElement("a");
          card.className = "article-card";
          card.href = `article.html?slug=${encodeURIComponent(article.__slug)}`;

          const imgHtml = article.image
            ? `<img src="${article.image}" alt="${article.title || ''}">`
            : `<img src="images/placeholder.jpg" alt="">`;

          const dateStr = article.date
            ? new Date(article.date).toLocaleDateString()
            : "";

          card.innerHTML = `
            ${imgHtml}
            <div class="article-card-body">
              <div class="article-card-category">${article.category || ""}</div>
              <h3>${article.title || "Untitled"}</h3>
              <p>${article.excerpt || ""}</p>
              <div class="meta">${article.author || ""} ${dateStr ? "· " + dateStr : ""}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = "Error loading articles: " + err.message;
        console.error(err);
      }
    }

    loadArticles();
  </script>
</body>
</html>
