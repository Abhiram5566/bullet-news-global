  <style>
    .articles-container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }
    .article-card {
      background: var(--bg-card, #161f30);
      border: 1px solid var(--border-color, #243046);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .article-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue, #38bdf8);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .article-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #1e293b;
    }
    .article-card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .article-card-category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-blue, #38bdf8);
      margin-bottom: 8px;
    }
    .article-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.35;
      color: #ffffff;
      font-weight: 700;
    }
    .article-card p {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: var(--text-secondary, #9ca3af);
      line-height: 1.5;
      flex-grow: 1;
    }
    .article-card .meta {
      font-size: 12px;
      color: var(--text-muted, #6b7280);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }
    #status { text-align: center; padding: 60px 20px; color: #9ca3af; font-size: 15px; }
  </style>
</head>

    <div id="status">Loading articles…</div>

  <script>
    // ==== REPO CONFIGURATION ====
    const GITHUB_USER = "Abhiram5566";
    const GITHUB_REPO = "bullet-news-global";
    const GITHUB_BRANCH = "main";
    const ARTICLES_PATH = "content/articles";
    // ============================

    const apiListUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ARTICLES_PATH}?ref=${GITHUB_BRANCH}`;

    async function loadArticles() {
      const statusEl = document.getElementById("status");
      const grid = document.getElementById("articles-grid");

      try {
        const listRes = await fetch(apiListUrl);
        if (!listRes.ok) throw new Error("Could not list articles (status " + listRes.status + ")");
        const files = await listRes.json();

        const jsonFiles = files.filter(f => f.name.endsWith(".json"));

        if (jsonFiles.length === 0) {
          statusEl.textContent = "No articles published yet.";
          return;
        }

        const articles = await Promise.all(
          jsonFiles.map(async (file) => {
            try {
              const res = await fetch(file.download_url);
              const data = await res.json();
              data.__slug = file.name.replace(/\.json$/, "");
              return data;
            } catch(e) { return null; }
          })
        );

        // Sort newest first
        const validArticles = articles
          .filter(a => a !== null)
          .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        statusEl.style.display = "none";

        validArticles.forEach((article) => {
          const card = document.createElement("a");
          card.className = "article-card";
          card.href = `article.html?slug=${encodeURIComponent(article.__slug)}`;

          const imgHtml = article.image
            ? `<img src="${article.image}" alt="${article.title || ''}">`
            : `<div style="height:180px; background:#1e293b; display:flex; align-items:center; justify-content:center; color:#888;">📰 Bullet News</div>`;

          const dateStr = article.date
            ? new Date(article.date).toLocaleDateString("en-US", { month: 'short', day: 'numeric', year: 'numeric' })
            : "";

          card.innerHTML = `
            ${imgHtml}
            <div class="article-card-body">
              <div class="article-card-category">${article.category || "ANALYSIS"}</div>
              <h3>${article.title || "Untitled"}</h3>
              <p>${article.excerpt || ""}</p>
              <div class="meta">
                <span>By ${article.author || "Staff"}</span>
                <span>${dateStr}</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = "Error loading articles: " + err.message;
        console.error(err);
      }
    }

    loadArticles();
  </script>
</body>
